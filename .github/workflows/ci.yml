name: CI

on:
  push:
    branches: [main, tyler]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install iOS Simulator Runtime
        run: |
          RUNTIME_PATH="$(xcode-select -p)/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS.simruntime"
          xcrun simctl runtime add "$RUNTIME_PATH" && echo "Runtime added" || echo "Runtime already installed or add failed"
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep iPhone | head -10

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp

      - name: Run Tests
        run: |
          xcodebuild test \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
