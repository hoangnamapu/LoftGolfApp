name: CI

on:
  push:
    branches: [main, tyler]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp

      - name: Run Tests
        run: |
          IOS_VER=$(xcrun simctl list runtimes | grep "^iOS 18" | tail -1 | awk '{print $2}')
          echo "Using iOS version: $IOS_VER"
          xcodebuild test \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp \
            -destination "platform=iOS Simulator,OS=$IOS_VER,name=iPhone 16" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
