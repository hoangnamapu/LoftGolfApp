name: CI

on:
  push:
    branches: [main, tyler]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Install iOS Simulator Runtime
        run: |
          xcrun simctl runtime add \
            "$(xcode-select -p)/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator/Profiles/Runtimes/iOS.simruntime" \
            2>/dev/null || true
          xcrun simctl list runtimes

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp

      - name: Run Tests
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 - <<'PYEOF'
import json, sys
data = json.load(sys.stdin)
for runtime in sorted(data["devices"].keys(), reverse=True):
    if "iOS" not in runtime:
        continue
    for d in data["devices"][runtime]:
        if "iPhone 16" in d["name"] and d.get("isAvailable", False):
            print(f'platform=iOS Simulator,id={d["udid"]}')
            sys.exit(0)
print("platform=iOS Simulator,name=iPhone 16")
PYEOF
          )
          echo "Destination: $DEST"
          xcodebuild test \
            -project LoftGolfApp.xcodeproj \
            -scheme LoftGolfApp \
            -destination "$DEST" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
